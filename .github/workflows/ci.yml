name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest Node the plugin supports (package.json `engines`): the
          # plugin's own tests. The browser tests' jsdom needs a newer Node.
          - { os: ubuntu-latest, node: 20.11.0, suite: runtime }
          - { os: ubuntu-latest, node: 22 }
          # The relay's BSD sed, sleep and missing setsid live here.
          - { os: macos-latest, node: 22 }
    steps:
      - uses: actions/checkout@v4

      # The pnpm version comes from package.json's packageManager field.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: ${{ matrix.suite == 'runtime' && 'pnpm test:runtime' || 'pnpm test' }}

      - name: The plugin wiring self-test
        env:
          CC_HARNESS_HOME: ${{ runner.temp }}/harness
        run: |
          status=0
          ./bin/coplan doctor || status=$?
          ./bin/coplan stop
          exit $status

      # ./setup.sh as a user runs it, with no agent to install in: it builds,
      # stages .plugin/, and the staged copy's CLI runs on its own.
      - name: Setup
        env:
          CC_HARNESS_HOME: ${{ runner.temp }}/harness
        run: |
          ./setup.sh --yes --agents none
          ./.plugin/bin/coplan version
          ./setup.sh --uninstall --yes
          test ! -e .plugin

      - name: Audit dependencies
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: pnpm audit --audit-level high

  lint-shell:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # shellcheck is on the runner image. The relay and setup run under
      # /bin/sh on every machine, so they are checked as POSIX sh.
      - name: shellcheck
        run: shellcheck --shell=sh --severity=warning bin/coplan-hook-relay.sh bin/coplan setup.sh

  validate-plugin:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Claude Code's own validator; Codex and Cursor manifests are checked
      # by the packaging tests (src/test/agents.test.ts).
      - name: claude plugin validate
        run: npx --yes @anthropic-ai/claude-code plugin validate .
